<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --ink: #111;
    --paper: #fff;
    --muted: #8a8a8a;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    transition: background .2s ease;
  }
  body.is-dark { background: #000; }

  /* 1920x1080 고정 무대 — 화면 크기에 맞춰 통째로 확대/축소 */
  .deck {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform-origin: center center;
    overflow: hidden;
    cursor: pointer;
  }

  .slide {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: var(--paper); color: var(--ink);
    overflow: hidden;
  }
  .slide.active { display: flex; }
  .slide.dark { background: #000; color: #fff; }

  /* 1. 타이틀 */
  .title { font-size: 240px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; }

  /* 2. 개요 */
  .intro { width: 1240px; margin-top: -60px; }
  .intro .eyebrow { font-size: 24px; font-weight: 700; color: var(--muted); letter-spacing: 0.1em; margin-bottom: 28px; }
  .intro h2 { font-size: 80px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.22; margin-bottom: 40px; word-break: keep-all; }
  .intro p { font-size: 32px; line-height: 1.65; color: #444; word-break: keep-all; }
  .stages { display: flex; gap: 32px; margin-top: 64px; }
  .stage-chip { flex: 1 1 0; border: 3px solid var(--ink); border-radius: 24px; padding: 28px 32px; }
  .stage-chip .n { font-size: 22px; font-weight: 700; color: var(--muted); }
  .stage-chip .t { font-size: 64px; font-weight: 900; letter-spacing: -0.03em; margin-top: 6px; }

  /* 게임 슬라이드: title → ready → flying → done */
  .scene {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: filter .5s ease, opacity .5s ease;
  }
  .slide[data-state="title"] .scene { filter: blur(18px); opacity: .35; }

  .hud {
    position: absolute; top: 60px; left: 80px; right: 80px;
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 800;
  }
  .hud .q { font-size: 44px; letter-spacing: -0.02em; }
  .hud .q span { color: var(--muted); font-weight: 700; margin-left: 0.5em; }
  .hud .sec { font-size: 34px; border: 3px solid var(--ink); border-radius: 999px; padding: 0.2em 0.9em; }

  .ready { text-align: center; transition: opacity .2s ease; }
  .ready-big { font-size: 220px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; }
  .ready-hint { font-size: 32px; font-weight: 600; color: var(--muted); margin-top: 32px; }
  .slide[data-state="flying"] .ready,
  .slide[data-state="done"] .ready { opacity: 0; }

  .mark {
    position: absolute; font-size: 360px; font-weight: 900; color: #e6e6e6; line-height: 1;
    opacity: 0; transition: opacity .3s ease;
  }
  .slide[data-state="done"] .mark { opacity: 1; }

  .stage-title {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .4s ease;
  }
  .slide[data-state="title"] .stage-title { opacity: 1; }
  .st-big { font-size: 320px; font-weight: 900; letter-spacing: -0.05em; line-height: 1; color: #000; }
  .st-sec { font-size: 56px; font-weight: 800; color: #000; margin-top: 24px; }
  .slide[data-state="title"] .st-big { animation: titleIn .7s var(--ease-out) both; }
  .slide[data-state="title"] .st-sec { animation: titleIn .7s var(--ease-out) .12s both; }
  @keyframes titleIn {
    from { transform: scale(1.25); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .flyer {
    position: absolute; left: 0; top: 0;
    height: 224px; width: auto; max-width: 385px; object-fit: contain;
    transform: translate(-200%, -200%);
    visibility: hidden;
    pointer-events: none;
    will-change: transform;
  }

  /* 문제 N 표지 */
  .qi-eyebrow {
    font-size: 32px; font-weight: 800; color: var(--muted); letter-spacing: 0.12em; margin-bottom: 24px;
    animation: upIn .7s var(--ease-out) both;
  }
  .qi-title {
    font-size: 260px; font-weight: 900; letter-spacing: -0.05em; line-height: 1;
    animation: upIn .7s var(--ease-out) .08s both;
  }

  /* 정답은 무엇일까요? */
  .q-label {
    font-size: 40px; font-weight: 800; color: var(--muted); margin-bottom: 28px;
    animation: slideIn .8s var(--ease-out) both;
  }
  .q-text {
    font-size: 150px; font-weight: 900; letter-spacing: -0.045em; line-height: 1;
    animation: slideIn .8s var(--ease-out) .08s both;
  }
  @keyframes slideIn {
    from { transform: translateX(900px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* 정답 */
  .answer-wrap { display: flex; align-items: center; gap: 100px; margin-top: -40px; }
  .a-img {
    height: 600px; width: auto; max-width: 820px; object-fit: contain;
    animation: imgIn .8s var(--ease-out) both;
  }
  .a-eyebrow { font-size: 40px; font-weight: 800; color: var(--muted); animation: upIn .7s var(--ease-out) .2s both; }
  .a-name {
    font-size: 200px; font-weight: 900; letter-spacing: -0.05em; line-height: 1.05; margin-top: 16px;
    animation: upIn .7s var(--ease-out) .3s both;
  }
  @keyframes imgIn {
    from { transform: scale(.7) rotate(-6deg); opacity: 0; }
    to { transform: scale(1) rotate(0); opacity: 1; }
  }
  @keyframes upIn {
    from { transform: translateY(60px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* 마지막 */
  .end-title { font-size: 220px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; }
  .end-sub { font-size: 36px; color: #9a9a9a; margin-top: 36px; }
  .home-btn {
    margin-top: 72px;
    font: inherit; font-size: 34px; font-weight: 800;
    color: #000; background: #fff; border: 0; border-radius: 999px;
    padding: 0.85em 2.2em; cursor: pointer;
    transition: transform .15s ease;
  }
  .home-btn:hover { transform: scale(1.04); }

  /* 하단 컨트롤 */
  .controls {
    position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%);
    display: flex; gap: 22px; align-items: center; z-index: 10;
  }
  .ctrl {
    width: 88px; height: 88px; border-radius: 50%;
    border: 3px solid var(--ink); background: var(--paper); color: var(--ink);
    display: grid; place-items: center; cursor: pointer;
    transition: background .15s ease, color .15s ease, opacity .15s ease;
  }
  .ctrl:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  .ctrl:disabled { opacity: 0.2; cursor: default; }
  .ctrl svg { width: 38px; height: 38px; }
  .ctrl.replay { display: none; }
  body.is-game .ctrl.replay { display: grid; }
  body.is-dark .ctrl { border-color: #fff; background: #000; color: #fff; }
  body.is-dark .ctrl:hover:not(:disabled) { background: #fff; color: #000; }

  /* 오른쪽 아래: 페이지 번호 + 정답 바로가기 */
  .pageinfo {
    position: absolute; right: 80px; bottom: 56px; z-index: 10;
    height: 88px; display: flex; align-items: center; gap: 24px;
  }
  .pageno {
    font-size: 24px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  body.is-dark .pageno { color: #555; }
  .answer-btn {
    display: none;
    font: inherit; font-size: 24px; font-weight: 800;
    color: var(--ink); background: var(--paper);
    border: 2px solid var(--ink); border-radius: 999px;
    padding: 6px 20px; cursor: pointer;
    visibility: hidden; opacity: 0;
    transition: opacity .25s ease, background .15s ease, color .15s ease;
  }
  body.is-game .answer-btn { display: inline-block; }
  body.is-done .answer-btn { visibility: visible; opacity: 1; }
  .answer-btn:hover { background: var(--ink); color: var(--paper); }

  /* 왼쪽 아래: 섹션 바로가기 */
  .sections {
    position: absolute; left: 80px; bottom: 56px; z-index: 10;
    height: 88px; display: flex; align-items: center; gap: 8px;
  }
  .sec-btn {
    font: inherit; font-size: 24px; font-weight: 700;
    color: var(--muted); background: none; border: 0;
    padding: 6px 12px; border-radius: 10px; cursor: pointer;
    transition: color .15s ease, background .15s ease;
  }
  .sec-btn:hover { color: var(--ink); background: #f2f2f2; }
  .sec-btn.current { color: var(--ink); font-weight: 900; text-decoration: underline; text-underline-offset: 8px; text-decoration-thickness: 3px; }
  body.is-dark .sec-btn { color: #555; }
  body.is-dark .sec-btn:hover { color: #fff; background: #1a1a1a; }
</style>
</head>
<body>
<div class="deck" id="deck">

<!-- 1. 타이틀 -->
<section class="slide">
  <h1 class="title">스피드 게임</h1>
</section>

<!-- 2. 개요 -->
<section class="slide">
  <div class="intro">
    <div class="eyebrow">ABOUT THE GAME</div>
    <h2>눈 깜짝할 사이에 지나가는 사진,<br>무엇인지 맞혀보세요!</h2>
    <p>화면 위로 사진 한 장이 순식간에 휙 지나갑니다. 음식일 수도, 물건일 수도, 누구나 아는 인물일 수도 있어요. 사진마다 3단계에 걸쳐 보여주니, 가장 먼저 정답을 외치는 사람이 승리!</p>
    <div class="stages">
      <div class="stage-chip"><div class="n">STAGE 1</div><div class="t">1단계</div></div>
      <div class="stage-chip"><div class="n">STAGE 2</div><div class="t">2단계</div></div>
      <div class="stage-chip"><div class="n">STAGE 3</div><div class="t">3단계</div></div>
    </div>
  </div>
</section>

<!-- 게임 · 정답 슬라이드는 스크립트에서 생성 -->
<div id="game-slides"></div>

<!-- 끝 -->
<section class="slide dark">
  <div class="end-title">게임 끝!</div>
  <div class="end-sub">모두 수고하셨습니다</div>
  <button class="home-btn" id="home">처음으로</button>
</section>

<nav class="controls">
  <button class="ctrl" id="prev" aria-label="이전 페이지">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="ctrl replay" id="replay" aria-label="다시 보기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
  </button>
  <button class="ctrl" id="next" aria-label="다음">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>
</nav>
<nav class="sections" id="sections"></nav>
<div class="pageinfo">
  <div class="pageno" id="pageno"></div>
  <button class="answer-btn" id="answer-btn">정답</button>
</div>
</div>

  // 단계별 통과 시간(초)과 방향
  //   lr: 왼쪽 → 오른쪽 / bt: 아래 → 위 / diag: 오른쪽 위 모서리 → 왼쪽 아래 모서리
  const STAGES = [
    { sec: 0.15, dir: "lr" },
    { sec: 0.4,  dir: "bt" },
    { sec: 0.7,  dir: "diag" },
  ];
  const TITLE_HOLD = 1500; // "N단계" 화면 유지 시간(ms) 후 대기화면으로

  // 문제마다: 1~3단계 → 정답은 무엇일까요? → 정답
  const holder = document.getElementById("game-slides");
  ITEMS.forEach((item, qi) => {
    const intro = document.createElement("section");
    intro.className = "slide";
    intro.innerHTML = `
      <div class="qi-eyebrow">QUESTION ${qi + 1}</div>
      <div class="qi-title">문제 ${qi + 1}</div>`;
    holder.appendChild(intro);

    STAGES.forEach(({ sec, dir }, si) => {
      const s = document.createElement("section");
      s.className = "slide game";
      s.dataset.sec = sec;
      s.dataset.dir = dir;
      s.innerHTML = `
        <div class="scene">
          <div class="hud">
            <div class="q">문제 ${qi + 1}<span>${si + 1}단계</span></div>
          </div>
          <div class="ready">
            <div class="ready-big">준비</div>
            <div class="ready-hint">클릭하면 사진이 지나갑니다</div>
          </div>
          <div class="mark">?</div>
        </div>
        <div class="stage-title">
          <div class="st-big">${si + 1}단계</div>
        </div>
        <img class="flyer" alt="" src="${item.src}">`;
      holder.appendChild(s);
    });

    const q = document.createElement("section");
    q.className = "slide";
    q.innerHTML = `
      <div class="q-label">문제 ${qi + 1}</div>
      <div class="q-text">정답은 무엇일까요?</div>`;
    holder.appendChild(q);

    const a = document.createElement("section");
    a.className = "slide";
    a.innerHTML = `
      <div class="answer-wrap">
        <img class="a-img" alt="${item.name}" src="${item.src}">
        <div>
          <div class="a-eyebrow">문제 ${qi + 1} 정답</div>
          <div class="a-name">${item.name}</div>
        </div>
      </div>`;
    holder.appendChild(a);
  });
  holder.replaceWith(...holder.children);

  const slides = [...document.querySelectorAll(".slide")];
  const prevBtn = document.getElementById("prev");
  const nextBtn = document.getElementById("next");
  const pageno = document.getElementById("pageno");
  let idx = 0;
  let timer = null;
  let anim = null;

  function stopGame() {
    clearTimeout(timer); timer = null;
    if (anim) { anim.cancel(); anim = null; }
  }

  function setState(slide, state) {
    slide.dataset.state = state;
    if (slide.classList.contains("active")) document.body.classList.toggle("is-done", state === "done");
  }

  // 페이지 위치: 제목 0, 설명 1, 문제 q 시작 = 2 + q*6 (문제 N, 1~3단계, 정답은?, 정답)
  const PER_Q = STAGES.length + 3;
  const qStart = (q) => 2 + q * PER_Q;
  const qOf = (i) => (i >= 2 && i < qStart(ITEMS.length)) ? Math.floor((i - 2) / PER_Q) : -1;

  // 왼쪽 아래 섹션 바로가기
  const sectionNav = document.getElementById("sections");
  const SECTIONS = [
    { label: "제목", at: 0 },
    { label: "설명", at: 1 },
    ...ITEMS.map((_, q) => ({ label: String(q + 1), at: qStart(q) })),
  ];
  const secBtns = SECTIONS.map((sec) => {
    const b = document.createElement("button");
    b.className = "sec-btn";
    b.textContent = sec.label;
    b.onclick = (e) => { e.stopPropagation(); show(sec.at); };
    sectionNav.appendChild(b);
    return b;
  });

  // 단계 화면 진입: 흐릿한 배경 위 "N단계" → 대기화면
  function enterGame(slide) {
    stopGame();
    slide.querySelector(".flyer").style.visibility = "hidden";
    setState(slide, "title");
    timer = setTimeout(() => setState(slide, "ready"), TITLE_HOLD);
  }

  async function fly(slide) {
    stopGame();
    const img = slide.querySelector(".flyer");
    const sec = parseFloat(slide.dataset.sec);
    setState(slide, "flying");
    if (img.decode) await img.decode().catch(() => {});
    if (!slide.classList.contains("active") || slide.dataset.state !== "flying") return;
    const w = img.offsetWidth, h = img.offsetHeight;
    const W = 1920, H = 1080;
    // 화면 밖에서 출발해 반대편 화면 밖까지, 정확히 sec초 동안 통과
    const PATHS = {
      lr:   [[-w, (H - h) / 2], [W, (H - h) / 2]],
      bt:   [[(W - w) / 2, H], [(W - w) / 2, -h]],
      diag: [[W, -h], [-w, H]],
    };
    const [[x0, y0], [x1, y1]] = PATHS[slide.dataset.dir] || PATHS.lr;
    img.style.visibility = "visible";
    anim = img.animate(
      [
        { transform: `translate(${x0}px, ${y0}px)` },
        { transform: `translate(${x1}px, ${y1}px)` },
      ],
      { duration: sec * 1000, easing: "linear", fill: "forwards" }
    );
    anim.onfinish = () => {
      img.style.visibility = "hidden";
      setState(slide, "done");
      anim = null;
    };
  }

  function show(i) {
    idx = Math.max(0, Math.min(slides.length - 1, i));
    document.activeElement?.blur();
    stopGame();
    slides.forEach((s, k) => s.classList.toggle("active", k === idx));
    const cur = slides[idx];
    document.body.classList.toggle("is-game", cur.classList.contains("game"));
    document.body.classList.toggle("is-dark", cur.classList.contains("dark"));
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === slides.length - 1;
    pageno.textContent = `${idx + 1} / ${slides.length}`;
    document.body.classList.remove("is-done");
    const q = qOf(idx);
    const curSection = idx <= 1 ? idx : (q >= 0 ? 2 + q : -1);
    secBtns.forEach((b, k) => b.classList.toggle("current", k === curSection));
    if (cur.classList.contains("game")) enterGame(cur);
  }

  // 다음: 게임 화면에서는 단계별로 한 걸음씩 진행
  function advance() {
    const cur = slides[idx];
    if (cur.classList.contains("game")) {
      const st = cur.dataset.state;
      if (st === "title") { stopGame(); setState(cur, "ready"); return; }
      if (st === "ready") { fly(cur); return; }
      if (st === "flying") return;
    }
    show(idx + 1);
  }

  prevBtn.onclick = (e) => { e.stopPropagation(); show(idx - 1); };
  nextBtn.onclick = (e) => { e.stopPropagation(); advance(); };
  document.getElementById("replay").onclick = (e) => {
    e.stopPropagation();
    if (slides[idx].classList.contains("game")) fly(slides[idx]);
  };
  document.getElementById("home").onclick = (e) => { e.stopPropagation(); show(0); };
  // 중간에 맞혔을 때: 이 문제의 정답 페이지로 바로
  document.getElementById("answer-btn").onclick = (e) => {
    e.stopPropagation();
    const q = qOf(idx);
    if (q >= 0) show(qStart(q) + PER_Q - 1);
  };

  // 화면 아무 곳이나 클릭해도 다음으로
  document.getElementById("deck").addEventListener("click", () => {
    if (!slides[idx].classList.contains("dark")) advance();
  });

  document.addEventListener("keydown", (e) => {
    if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); advance(); }
    else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); show(idx - 1); }
    else if (e.key === "r" || e.key === "R") { document.getElementById("replay").click(); }
    else if (e.key === "Home") { show(0); }
    else if (e.key === "f" || e.key === "F") {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    }
  });

  const deck = document.getElementById("deck");
  function fit() {
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    deck.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  window.addEventListener("resize", fit);
  fit();

  show(0);
</script>
</body>
</html>
